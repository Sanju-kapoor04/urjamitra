version: '3.8'

services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: urjamitra-ai
    ports:
      - "8001:8001"
    environment:
      - PORT=8001

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urjamitra-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AI_SERVICE_URL=http://ai-service:8001
      - JWT_SECRET=urjamitra_production_secret_key_2026
    depends_on:
      - ai-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urjamitra-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
